<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"
    />

    <!-- PWA: o que faz o app caber na tela de início do telefone.
         `viewport-fit=cover` acima é parte disto: instalado, o app desenha por
         baixo do notch e da barra de gestos, e é o `h-viewport`/safe-area do
         tema que devolve o respiro. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Self OS" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf8f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141110" />
    <!-- O nome do produto passa por i18n em todo lugar (brand.name); aqui não
         alcança — o título do documento é lido antes do React existir. -->
    <title>Self OS</title>
    <script>
      /*
        Anti-flash do tema escuro.

        Aplica a classe `.dark` no <html> ANTES do primeiro quadro. Sem isto o
        navegador pinta a página com o tema claro e o React só troca depois de
        montar: um clarão branco de um quadro, toda vez que o app abre no escuro.

        Precisa ser inline e síncrono no <head> — um arquivo externo já chegaria
        tarde demais. É a MESMA chave e a MESMA regra do ThemeContext.tsx
        (src/shared/context/): mexeu lá, mexa aqui.
      */
      ;(function () {
        try {
          var salvo = localStorage.getItem('selfos.theme')
          var escuro =
            salvo === 'dark' ||
            ((!salvo || salvo === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (escuro) document.documentElement.classList.add('dark')
        } catch (e) {
          /* Sem localStorage: abre no claro. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
